<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <title>人形机器人任务控制系统</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="container">

    <h1>人形机器人任务控制系统</h1>

    <!-- 机器人状态面板 -->
    <div class="panel">

      <h2>机器人状态</h2>

      <p>
        机器人ID：
        <span>R-001</span>
      </p>

      <p>
        在线状态：
        <span id="status">在线</span>
      </p>

      <p>
        当前动作：
        <span id="action">FORWARD</span>
      </p>

      <p>
        电量：
        <span id="battery">85%</span>
      </p>

    </div>

    <!-- 视觉避障状态 -->
    <div class="panel">

      <h2>视觉避障状态</h2>

      <p>
        障碍物检测：
        <span id="obstacle">无</span>
      </p>

      <p>
        避障状态：
        <span id="avoidState">正常前进</span>
      </p>

      <p>
        摄像头状态：
        <span id="cameraStatus">正常</span>
      </p>

    </div>

    <!-- 状态机状态 -->
    <div class="panel">

      <h2>机器人状态机</h2>

      <p class="state-text">

        当前状态：

        <span id="robotState">
          FORWARD
        </span>

      </p>

    </div>

    <!-- 控制面板 -->
    <div class="panel">

      <h2>动作控制</h2>

      <button onclick="sendCommand('FORWARD')">
        前进
      </button>

      <button onclick="sendCommand('LEFT')">
        左转
      </button>

      <button onclick="sendCommand('RIGHT')">
        右转
      </button>

      <button onclick="sendCommand('TURN')">
        原地掉头
      </button>

      <button onclick="sendCommand('STOP')">
        停止
      </button>

    </div>

    <!-- 日志系统 -->
    <div class="panel">

      <h2>系统日志</h2>

      <div id="logs"></div>

    </div>

  </div>

  <script src="app.js"></script>

</body>

</html>
